# Сервер комнат ТоргСина (Р-01, Р-02). Выкатка — Action по слиянию в main (server.yml).
# Пароль компании ROOM_PASSWORD — секрет Worker'а, ставится в панели Cloudflare, не здесь
name = "torg-sin"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Реестр комнат (этап 6): один объект на сервер — номера всех комнат для выгрузки
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

# Бесплатный план — только объекты на SQLite
# Суточная копия комнат в приватный репо данных (этап 6, server/src/backup.ts): ночь по Екатеринбургу —
# 21:17 UTC, там 02:17; то же время — BACKUP_HOUR_UTC и BACKUP_MINUTE_UTC в backup.ts.
# Токен DATA_TOKEN и репо DATA_REPO — оба секретами Worker'а в панели Cloudflare, не [vars]: переменные
# панели выкатка стирает, секреты переживают. Не заданы — копия пропускается, сервер работает как раньше
[triggers]
crons = ["17 21 * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registry"]
